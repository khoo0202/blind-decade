<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>十年盲投</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#F4F6F9; --ink:#141C26; --ink2:#4A5563; --muted:#7C8794; --rule:#D8DEE5;
  --accent:#D9531F; --accent-ink:#FFFFFF; --accent-soft:#FBE7DE;
  --you:#eb6834; --idx:#2a78d6; --cash:#1baf7a;
  --g-cash:#1baf7a; --g-gold:#eda100; --g-bond:#4a3aa7; --g-lev:#e34948; --g-fund:#2a78d6; --g-stk:#e87ba4;
  --up:#13804F; --down:#C23A3A; --up-soft:#E3F3EA; --down-soft:#FBE6E6;
  --hatch:rgba(20,28,38,.06); --shadow:0 1px 2px rgba(20,28,38,.06),0 8px 28px rgba(20,28,38,.07); --scrim:rgba(14,19,26,.55);
  --serif:"Noto Serif SC","Songti SC","SimSun",serif; --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1218; --surface:#151C25; --sunk:#111820; --ink:#EDF1F5; --ink2:#B4BECA; --muted:#8793A1; --rule:#27313D;
    --accent:#F0703D; --accent-ink:#1A0C05; --accent-soft:#3A2016;
    --you:#d95926; --idx:#3987e5; --cash:#199e70;
    --g-cash:#199e70; --g-gold:#c98500; --g-bond:#9085e9; --g-lev:#e66767; --g-fund:#3987e5; --g-stk:#d55181;
    --up:#3FBF7F; --down:#F07070; --up-soft:#15291F; --down-soft:#321A1C;
    --hatch:rgba(237,241,245,.05); --shadow:none; --scrim:rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1218; --surface:#151C25; --sunk:#111820; --ink:#EDF1F5; --ink2:#B4BECA; --muted:#8793A1; --rule:#27313D;
  --accent:#F0703D; --accent-ink:#1A0C05; --accent-soft:#3A2016;
  --you:#d95926; --idx:#3987e5; --cash:#199e70;
  --g-cash:#199e70; --g-gold:#c98500; --g-bond:#9085e9; --g-lev:#e66767; --g-fund:#3987e5; --g-stk:#d55181;
  --up:#3FBF7F; --down:#F07070; --up-soft:#15291F; --down-soft:#321A1C;
  --hatch:rgba(237,241,245,.05); --shadow:none; --scrim:rgba(0,0,0,.65);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

/* ---------- app shell ---------- */
.app{height:100%;display:flex;flex-direction:column;max-width:1280px;margin:0 auto;background:var(--bg)}
.top{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 16px 11px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--rule)}
.t-when b{display:block;font-family:var(--serif);font-size:16px;line-height:1.2;white-space:nowrap}
.t-when small{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.redact{display:inline-block;background:var(--ink);color:transparent;border-radius:2px;padding:0 1px;user-select:none;font-size:10px;line-height:1.2}
.t-total{text-align:center;min-width:0}
.t-total small{display:block;font-size:11px;color:var(--muted)}
.t-total b{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;line-height:1.15;transition:color .3s}
.t-total b.flash-up{color:var(--up)} .t-total b.flash-down{color:var(--down)}
.t-vs{width:118px}
.vsbar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;background:var(--surface)}
.vsbar i{display:block;height:100%;transition:flex-grow .45s ease}
#vs-you{background:var(--you)} #vs-lw{background:var(--idx)}
.vs-lbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:3px}
.vs-txt{display:block;font-size:12px;font-weight:500;text-align:right;white-space:nowrap}
.prog{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:transparent}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.icon-btn{display:none;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:14px}
.icon-btn svg{width:18px;height:18px}

.content{flex:1;min-height:0;overflow:auto;padding:10px 14px;position:relative;-webkit-overflow-scrolling:touch}
.col-l,.col-r{display:contents}
.pane{display:none;flex-direction:column;gap:10px;min-height:100%}
.app[data-tab="month"] #pane-month,.app[data-tab="invest"] #pane-invest,.app[data-tab="chart"] #pane-chart,.app[data-tab="album"] #pane-album{display:flex}
.shake{animation:shake .3s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

.actions{display:flex;gap:8px;padding:8px 16px;background:var(--surface);border-top:1px solid var(--rule)}
.btn{border-radius:12px;border:1px solid var(--rule);background:var(--surface);padding:0 14px;min-height:48px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--ink2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:16px}
.btn.primary:hover:not(:disabled){filter:brightness(1.05)}
.btn svg{width:18px;height:18px}
#skip{flex:0 0 auto;font-size:14px}
#next{flex:1}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border:0;background:none;color:var(--muted);font-size:11px}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent);font-weight:500}
.tab .dot{position:absolute;top:7px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* ---------- month pane ---------- */
.evcard{position:relative;flex:1;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:14px;box-shadow:var(--shadow);touch-action:pan-y;user-select:none;min-height:230px}
.evcard.enter{animation:enter .35s cubic-bezier(.2,.9,.3,1.1)}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.evcard.flip{animation:flipc .45s ease}
@keyframes flipc{0%{transform:perspective(900px) rotateY(0)}50%{transform:perspective(900px) rotateY(90deg)}100%{transform:perspective(900px) rotateY(0)}}
.evcard.big{border-color:var(--accent)}
.ev-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ev-tag{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.evcard.big .ev-tag{color:var(--accent)}
.ev-count{font-family:var(--mono);font-size:11.5px;color:var(--ink2);white-space:nowrap}
.ev-head{font-size:13px;color:var(--ink2);background:var(--sunk);border-radius:8px;padding:4px 9px;align-self:flex-start}
.ev-title{font-family:var(--serif);font-weight:900;font-size:20px;line-height:1.3;margin:0;text-wrap:balance}
.ev-title .mono{font-family:var(--mono);font-size:19px;font-weight:600;white-space:nowrap}
.ev-body{margin:0;color:var(--ink2);font-size:14.5px}
.ev-sub{font-size:13px;color:var(--ink2);font-family:var(--mono)}
.ev-choices{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:8px;margin-top:auto}
.ev-choices button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:54px;border:1px solid var(--rule);background:var(--sunk);border-radius:12px;padding:6px 6px;text-align:center}
.ev-choices button b{font-weight:600;font-size:14.5px;line-height:1.25}
.ev-choices button span{font-size:11.5px;color:var(--muted);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.ev-choices button:hover:not(:disabled){border-color:var(--accent)}
.ev-choices button:disabled{opacity:.45;cursor:default}
.ev-choices button.l b{color:var(--down)} .ev-choices button.r b{color:var(--up)}
.ev-swipe{font-size:11.5px;color:var(--muted);text-align:center}
.ev-result{margin-top:auto;padding:12px 14px;border-radius:12px;background:var(--sunk);border:1px solid var(--rule);font-size:14.5px}
.ev-result b{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:2px}
.ev-cont{align-self:stretch}
.ev-more summary{cursor:pointer;font-size:12.5px;color:var(--ink2)}
.ev-more ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
.ev-more li .mono{font-size:12px}
.hint-l,.hint-r{position:absolute;top:16px;padding:4px 10px;border-radius:8px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;border:2px solid}
.hint-l{right:16px;color:var(--down);border-color:var(--down);transform:rotate(8deg)}
.hint-r{left:16px;color:var(--up);border-color:var(--up);transform:rotate(-8deg)}
.mside{display:flex;flex-direction:column;gap:10px}
.lw{display:flex;gap:10px;align-items:flex-start}
.lw-av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--idx);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:18px}
.lw-bub{position:relative;flex:1;background:var(--surface);border:1px solid var(--rule);border-radius:4px 14px 14px 14px;padding:5px 11px;font-size:13px;line-height:1.4}
.lw-bub b{font-size:11px;color:var(--muted);font-weight:500;display:block}
.missions{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:8px 12px}
.missions h3{margin:0 0 3px;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.06em;display:flex;justify-content:space-between}
.mi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;align-items:center;padding:2px 0}
.mi span{font-size:12px;line-height:1.3}
.mi em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.mi .bar{grid-column:1 / -1;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.mi .bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.mi.done span{color:var(--up)} .mi.done .bar i{background:var(--up)}
.mi.fail span,.mi.na span{color:var(--muted)}

/* share card */
.sharecard{flex:1;display:flex;flex-direction:column;gap:8px;border-radius:20px;padding:18px;background:linear-gradient(160deg,var(--surface) 0%,var(--sunk) 100%);border:1px solid var(--rule);box-shadow:var(--shadow)}
.sc-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-family:var(--mono);letter-spacing:.06em}
.sc-brand{font-family:var(--serif);font-weight:900;color:var(--ink);letter-spacing:.1em}
.sc-row{display:flex;align-items:center;gap:14px}
.sc-grade{flex:none;width:72px;height:72px;border-radius:16px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--serif);font-weight:900;font-size:44px;line-height:1}
.sc-head{font-family:var(--serif);font-weight:900;font-size:21px;line-height:1.3}
.sc-head small{display:block;font-family:var(--sans);font-weight:400;font-size:13px;color:var(--ink2)}
.sc-cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc-cmp div{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted)}
.sc-cmp b{display:block;font-family:var(--mono);font-size:17px;color:var(--ink)}
.sc-events{display:flex;flex-wrap:wrap;gap:5px}
.sc-events span{font-size:11.5px;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:1px 7px;color:var(--ink2)}
.sc-list{margin:0;padding-left:16px;font-size:12.5px;color:var(--ink2)}
.sc-badges{display:flex;flex-wrap:wrap;gap:5px}
.sc-badges span{font-size:11.5px;border-radius:999px;padding:1px 9px;background:var(--accent-soft);color:var(--accent)}
.sc-foot{margin-top:auto;font-size:11.5px;color:var(--muted);text-align:center}
.sc-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---------- invest pane ---------- */
.comp{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.comp i{display:block;height:100%;min-width:2px;transition:flex-grow .35s}
.comp-legend{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:6px;font-size:11.5px;color:var(--ink2)}
.comp-legend span{display:inline-flex;align-items:center;gap:5px}
.cashrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:10px 12px}
.cashrow .c-v b{font-family:var(--mono);font-size:17px}
.cashrow .c-v small{display:block;font-size:11.5px;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);cursor:pointer;text-align:right;line-height:1.3}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle .sw2{flex:none;width:40px;height:24px;border-radius:12px;background:var(--rule);position:relative;transition:background .2s}
.toggle .sw2::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle input:checked + .sw2{background:var(--up)}
.toggle input:checked + .sw2::after{transform:translateX(16px)}
.toggle input:focus-visible + .sw2{outline:2px solid var(--accent);outline-offset:2px}
.alist{display:flex;flex-direction:column;gap:8px}
.arow{display:flex;align-items:stretch;gap:8px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:8px 8px 8px 12px}
.arow.flash{animation:flash 1s ease}
@keyframes flash{0%{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}100%{}}
.a-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;background:none;border:0;padding:0;text-align:left}
.a-nm{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.a-sub{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.a-hold{font-size:12px;color:var(--muted)}
.a-hold .mono{font-size:12px}
.a-btns{display:flex;gap:6px;align-items:center}
.pm{width:46px;height:46px;border-radius:12px;border:1px solid var(--rule);background:var(--sunk);font-size:22px;font-weight:500;line-height:1;display:grid;place-items:center}
.pm.plus{background:var(--up-soft);border-color:color-mix(in srgb,var(--up) 40%,var(--rule));color:var(--up)}
.pm.minus{color:var(--down)}
.pm:disabled{opacity:.35;cursor:default}
.tag{font-size:10.5px;font-weight:400;letter-spacing:.04em;padding:0 6px;border-radius:4px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap;line-height:1.7}
.tag.real{border-color:color-mix(in srgb,var(--up) 45%,var(--rule));color:var(--up)}
.tag.new{border-color:var(--accent);color:var(--accent)}
.lockhint,.sharehint{margin:0;font-size:12px;color:var(--muted);text-align:center}
.lockhint{padding:10px;border:1px dashed var(--rule);border-radius:12px}

/* ---------- chart pane ---------- */
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:2px;border-radius:1px;display:inline-block}
.chartbox{position:relative;flex:1;min-height:220px;background:var(--surface);border:1px solid var(--rule);border-radius:14px}
.chartbox svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.12);min-width:150px;z-index:3}
.tip b{font-weight:500;display:block;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:12px;color:var(--ink2)}
.tip .r span:first-child{display:inline-flex;align-items:center;gap:6px}
.tip .r span:last-child{font-family:var(--mono);color:var(--ink)}
.axis text{fill:var(--muted);font-family:var(--mono);font-size:11px}
.axis line{stroke:var(--rule)}
.endlab{font-size:12px;fill:var(--ink2)}
.endlab tspan.v{font-family:var(--mono);fill:var(--ink)}
.future text{fill:var(--muted);font-size:12px;letter-spacing:.1em}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.kv div{background:var(--surface);padding:7px 11px}
.kv span{display:block;font-size:11px;color:var(--muted)}
.kv b{font-family:var(--mono);font-weight:500;font-size:14px}
details.older summary{cursor:pointer;font-size:13px;color:var(--ink2)}
.older-list{margin:6px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
.older-list b{font-weight:500;color:var(--muted);font-family:var(--mono);font-size:11.5px;margin-right:6px}

/* ---------- album ---------- */
.mtabs{display:flex;gap:4px}
.mtab{background:none;border:1px solid transparent;border-radius:8px;padding:5px 12px;color:var(--ink2);font-size:14px;min-height:36px}
.mtab[aria-selected="true"]{background:var(--surface);border-color:var(--rule);color:var(--ink);font-weight:500}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.cg{border:1px dashed var(--rule);background:transparent;border-radius:10px;padding:10px 12px;text-align:left;min-height:62px;display:flex;flex-direction:column;gap:2px}
.cg .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.cg .t{font-size:13px;color:var(--muted);line-height:1.4}
.cg.got{border-style:solid;background:var(--surface)}
.cg.got .t{color:var(--ink);font-weight:500}
.cg.new{border-color:var(--accent)}
.cg:disabled{cursor:default}

/* ---------- toast / modal / coach ---------- */
.toasts{position:fixed;bottom:calc(124px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,480px)}
.toast{background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 14px;font-size:13.5px;box-shadow:0 6px 24px rgba(0,0,0,.2);animation:tin .25s ease;max-width:100%}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.overlay{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:18px;width:min(560px,100%);max-height:calc(100% - 16px);overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
.modal.wide{width:min(720px,100%)}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
.modal.flip{animation:flip .5s cubic-bezier(.2,.8,.3,1)}
@keyframes flip{0%{opacity:0;transform:perspective(900px) rotateY(-70deg) scale(.9)}60%{opacity:1}100%{transform:none}}
.modal .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
.modal h3{font-family:var(--serif);font-size:23px;line-height:1.3;margin:4px 0 10px;text-wrap:balance}
.modal p{margin:0 0 10px;color:var(--ink2)}
.modal .x{float:right;background:none;border:0;font-size:24px;line-height:1;color:var(--muted);padding:4px 8px;border-radius:6px;min-width:40px;min-height:40px}
.modal .x:hover{color:var(--ink);background:var(--sunk)}
.modal .foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:16px}
.quiz{margin-top:14px;padding:14px;border-radius:12px;background:var(--sunk);border:1px solid var(--rule)}
.quiz .q{font-weight:500;margin-bottom:10px}
.quiz .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.quiz .opts button{border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:10px;font-weight:500;min-height:44px}
.quiz .opts button:hover:not(:disabled){border-color:var(--ink2)}
.quiz .opts button.right{background:var(--up-soft);border-color:var(--up);color:var(--up)}
.quiz .opts button.wrong{background:var(--down-soft);border-color:var(--down);color:var(--down)}
.quiz .ex{margin-top:10px;font-size:14px;color:var(--ink2)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.modes button{text-align:left;border:1px solid var(--rule);background:var(--sunk);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.modes button:hover{border-color:var(--accent)}
.modes button b{font-weight:500}
.modes button span{font-size:12.5px;color:var(--muted);line-height:1.45}
.modes button em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--accent)}
.modes .lv{grid-column:1 / -1;font-size:12px;color:var(--muted);letter-spacing:.08em;margin-top:6px}
@media (max-width:520px){.modes{grid-template-columns:1fr}}
.trade-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.trade-px{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.2}
.trade-sub{font-family:var(--mono);font-size:12.5px;color:var(--ink2)}
.mini{margin:10px 0 6px;border-radius:10px;background:var(--sunk);padding:6px}
.mini svg{display:block;width:100%;height:auto}
.poscard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border-radius:10px;overflow:hidden;margin:10px 0}
.poscard div{background:var(--sunk);padding:8px 10px}
.poscard span{display:block;font-size:11px;color:var(--muted)}
.poscard b{font-family:var(--mono);font-weight:500;font-size:14px}
@media (max-width:480px){.poscard{grid-template-columns:repeat(2,minmax(0,1fr))}}
.side-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.side-tabs button{border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:8px;font-weight:500;min-height:44px}
.side-tabs button[aria-pressed="true"].buy{background:var(--up-soft);border-color:var(--up);color:var(--up)}
.side-tabs button[aria-pressed="true"].sell{background:var(--down-soft);border-color:var(--down);color:var(--down)}
.amt{display:flex;align-items:center;gap:8px;margin-top:12px}
.amt label{font-size:13px;color:var(--ink2);white-space:nowrap}
.amt input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);font-family:var(--mono);font-size:16px}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qchips button{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink2)}
.preview{margin-top:10px;font-size:13px;color:var(--ink2);min-height:1.5em}
.preview.err{color:var(--down)}
.rep .grade{float:right;width:60px;height:60px;border-radius:14px;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:34px;background:var(--accent);color:var(--accent-ink);margin:0 0 8px 12px}
.rep .events{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.rep .events span{background:var(--sunk);border:1px solid var(--rule);border-radius:6px;padding:2px 9px;font-size:13px;color:var(--ink2)}
.tbl{overflow-x:auto;margin:6px 0 4px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px}
th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:12px}
td:first-child,th:first-child{text-align:left}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}
td.t{font-family:var(--sans)}
tr.me td{font-weight:600}
.rep h4{font-family:var(--serif);font-size:16px;margin:16px 0 6px}
.rep p{font-size:14px}
.achs{display:flex;flex-wrap:wrap;gap:6px}
.ach{border:1px solid var(--rule);border-radius:8px;padding:3px 10px;font-size:13px;background:var(--sunk)}
.ach.new{border-color:var(--accent);color:var(--accent)}
.coach{position:fixed;inset:0;z-index:50}
.coach-hole{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px rgba(8,12,18,.66);transition:all .3s ease;pointer-events:none}
.coach-tip{position:absolute;left:16px;right:16px;max-width:420px;margin:0 auto;background:var(--surface);color:var(--ink);border-radius:14px;padding:14px 16px;box-shadow:0 10px 40px rgba(0,0,0,.35);font-size:15px}
.coach-tip small{display:block;margin-top:8px;font-size:12px;color:var(--muted)}
#confetti{position:fixed;inset:0;z-index:45;pointer-events:none}

/* ---------- desktop ---------- */
@media (min-width:960px){
  .app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;padding:0 20px}
  .top{border:1px solid var(--rule);border-top:0;border-radius:0 0 16px 16px;grid-template-columns:auto minmax(0,1fr) auto auto;padding:12px 20px 13px}
  .t-vs{width:190px}
  .icon-btn{display:inline-flex}
  .content{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px;overflow:hidden;padding:16px 0 0}
  .col-l{display:flex;flex-direction:column;gap:16px;min-height:0}
  .col-r{display:flex;flex-direction:column;min-height:0}
  .app .pane{display:flex}
  #pane-album{display:none!important}
  #pane-month{flex:none;min-height:0;display:grid!important;grid-template-columns:minmax(0,1fr) 270px;gap:14px;align-items:stretch}
  #pane-chart{flex:1;min-height:0}
  #pane-invest{flex:1;min-height:0;overflow:auto;padding-right:4px}
  .evcard{min-height:290px}
  .tabbar{display:none}
  .toasts{bottom:92px}
  .col-l{overflow:auto}
  .chartbox{min-height:150px}
  .app.ended .mside{display:flex}
  .actions{background:transparent;border-top:0;padding:12px 0 16px;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px}
  .actions .acts-l{display:flex;gap:8px}
  #next{flex:1}
}
.acts-l{display:contents}
.app.ended .mside{display:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app" data-tab="month">
  <header class="top">
    <div class="t-when"><b id="when">第 1 年 · 1 月</b><small id="yr"><span class="redact">1999</span> 年份已隐藏</small></div>
    <div class="t-total"><small>我的总资产</small><b id="total">$10,000</b></div>
    <div class="t-vs" id="t-vs">
      <div class="vsbar" aria-hidden="true"><i id="vs-you" style="flex-grow:1"></i><i id="vs-lw" style="flex-grow:1"></i></div>
      <div class="vs-lbl"><span>我</span><span>老王</span></div>
      <span class="vs-txt" id="vs-txt">和老王持平</span>
    </div>
    <button class="icon-btn" id="btn-album" aria-label="打开图鉴"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="12" height="15" rx="2"/><path d="M7 4.5h11a2 2 0 0 1 2 2V18"/></svg>图鉴</button>
    <div class="prog"><i id="prog"></i></div>
  </header>

  <main class="content" id="content">
    <div class="col-l">
      <section class="pane" id="pane-month" aria-label="本月">
        <div class="evcard" id="evcard"></div>
        <div class="mside">
          <div class="lw"><div class="lw-av" aria-hidden="true">王</div><div class="lw-bub"><b>老王 · 懒人定投</b><span id="lw-line">每个月买，买完就忘。</span></div></div>
          <div class="missions" id="missions"></div>
        </div>
      </section>
      <section class="pane" id="pane-chart" aria-label="走势">
        <div class="legend">
          <span><i style="background:var(--you);height:3px"></i>我</span>
          <span><i style="background:var(--idx)"></i>老王（懒人定投）</span>
          <span><i style="background:var(--cash)"></i>全放现金</span>
        </div>
        <div class="chartbox" id="chartbox"><svg id="chart" role="img" aria-label="资产走势图"></svg><div class="tip" id="tip" hidden></div></div>
        <div class="kv" id="kv"></div>
        <details class="older" id="older"><summary>往期新闻</summary><ul class="older-list" id="older-list"></ul></details>
      </section>
    </div>
    <div class="col-r">
      <section class="pane" id="pane-invest" aria-label="投资">
        <div><div class="comp" id="comp" aria-hidden="true"></div><div class="comp-legend" id="comp-legend"></div></div>
        <div class="cashrow">
          <div class="c-v"><small>现金</small><b id="cash-v">$10,000</b></div>
          <label class="toggle"><span>工资自动买<br>标普500</span><input type="checkbox" id="auto-t"><span class="sw2"></span></label>
        </div>
        <div class="alist" id="alist"></div>
        <p class="lockhint" id="lockhint"></p>
        <p class="sharehint" id="sharehint"></p>
      </section>
      <section class="pane" id="pane-album" aria-label="图鉴">
        <div class="mtabs" role="tablist"><button class="mtab al-cards" role="tab" aria-selected="true">知识卡 <span class="mono al-cards-n"></span></button><button class="mtab al-ach" role="tab" aria-selected="false">成就 <span class="mono al-ach-n"></span></button></div>
        <div class="cardgrid" id="album"></div>
      </section>
    </div>
  </main>

  <div class="actions">
    <div class="acts-l">
      <button class="btn" id="skip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 6l8 6-8 6zM12 6l8 6-8 6z"/></svg><span id="skip-t">跳到下一件大事</span></button>
      <button class="btn primary" id="next">下个月 →</button>
    </div>
  </div>

  <nav class="tabbar" role="tablist" aria-label="页面">
    <button class="tab" data-tab="month" role="tab" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>本月</button>
    <button class="tab" data-tab="invest" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3v9h9a9 9 0 1 1-9-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>投资<i class="dot" id="inv-dot" hidden></i></button>
    <button class="tab" data-tab="chart" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M4 19h16"/><path d="M5 15l4-4 3 3 6-7"/></svg>走势</button>
    <button class="tab" data-tab="album" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="12" height="15" rx="2"/><path d="M7 4.5h11a2 2 0 0 1 2 2V18"/></svg>图鉴</button>
  </nav>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="overlay" id="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="coach" id="coach" hidden><div class="coach-hole" id="coach-hole"></div><div class="coach-tip" id="coach-tip"></div></div>

<script src="data.js"></script>
<script>
const DATA = window.DATA;
const N = DATA.m.length;
const START_CASH = 10000, BASE_DEPOSIT = 300, BONUS = 1500, FEE = 0.001, FEE_MIN = 1;
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const idxOf = (y,m) => (y-1928)*12 + (m-1);
const realYM = s => [1928 + Math.floor(s/12), s%12 + 1];

const MODES = {
  blind10:{name:'盲盒十年', len:120, reveal:false, desc:'随机抽一段真实的十年，年份隐藏，结束才揭晓。'},
  blind5: {name:'快速五年', len:60,  reveal:false, desc:'五年一局，十分钟左右，适合先上手。'},
  l1929:{name:'大萧条', len:120, reveal:true, s0:idxOf(1928,1), desc:'1928 年初，股市已经连涨多年，人人都在谈论股票。'},
  l1972:{name:'滞胀年代', len:120, reveal:true, s0:idxOf(1972,1), desc:'1972 年，经济看起来不错，但通胀的苗头已经出现。'},
  l1997:{name:'互联网泡沫', len:120, reveal:true, s0:idxOf(1997,1), desc:'1997 年，互联网刚刚兴起，科技股开始狂飙。'},
  l2005:{name:'金融危机', len:120, reveal:true, s0:idxOf(2005,1), desc:'2005 年，房价节节攀升，银行放贷越来越宽松。'},
  l2016:{name:'疫情与 AI', len:120, reveal:true, s0:idxOf(2016,9), desc:'2016 年秋天，市场平稳，没人想到接下来十年这么戏剧化。'},
};
const GROUPS = [
  {k:'cash',name:'现金',c:'--g-cash'},{k:'gold',name:'黄金',c:'--g-gold'},{k:'bond',name:'债券',c:'--g-bond'},
  {k:'lev',name:'杠杆',c:'--g-lev'},{k:'fund',name:'股票基金',c:'--g-fund'},{k:'stock',name:'个股',c:'--g-stk'},
];
const EQUITY = new Set(['fund','lev','stock']);
const SECTORS = {科技:[1.4,.30],互联网:[1.5,.40],汽车:[1.3,.35],医疗:[.8,.30],能源:[1.0,.28],消费:[.7,.20],交通:[1.3,.32],金融:[1.2,.25],工业:[1.1,.25],地产:[1.2,.30]};
const STOCK_POOL = [
  ['星辰科技','科技','设计手机芯片，客户遍布全球'],['云帆软件','科技','给企业卖云端办公软件'],['量子游戏','科技','开发手机游戏，靠爆款吃饭'],
  ['快跑外卖','互联网','外卖平台，还在烧钱抢市场'],['萌宠之家','互联网','网上卖宠物用品，增长很快'],
  ['极光电动','汽车','电动车新贵，还没有赚过钱'],['天工汽车','汽车','老牌汽油车厂，工人很多'],
  ['北辰医药','医疗','研发抗癌新药，成败看临床试验'],['康宁医疗','医疗','全国连锁诊所和药房'],
  ['金穗能源','能源','开采石油和天然气'],['蓝鲸零售','消费','全国连锁超市'],['甜心饮料','消费','百年饮料品牌，年年分红'],
  ['远航航空','交通','国内第二大航空公司'],['磐石银行','金融','大型商业银行，放贷款赚利差'],['朝晖材料','工业','生产钢铁和建材'],['绿洲地产','地产','盖房子卖房子的开发商'],
];
const ARCH = [
  {k:'star',p:.12,label:'超级明星',alpha:.10,text:'长期大幅跑赢市场。这样的公司很少，事前也几乎认不出来。'},
  {k:'blue',p:.22,label:'稳健蓝筹',alpha:.02,idio:.6,text:'波动较小、稳稳增长的成熟公司。'},
  {k:'avg', p:.28,label:'普通公司',alpha:-.01,text:'波动比大盘大，收益却差不多甚至更低。大多数个股都是这样。'},
  {k:'fade',p:.20,label:'逐渐衰落',alpha:-.08,text:'慢慢失去竞争力，股价长期跑输。很多昔日明星最后都走到这一步。'},
  {k:'blow',p:.10,label:'暴雷股',alpha:-.02,text:'某个月突然出事，一次跌掉大半，有时直接破产退市。'},
  {k:'turn',p:.08,label:'困境反转',alpha:0,text:'先跌得惨不忍睹，换了管理层后又强势反弹。能熬过前半段的人很少。'},
];
const EVENTS = [
  [1929,1932,'大萧条，股市最多跌去八成以上'],[1937,1938,'1937–38 年经济衰退'],[1939,1945,'第二次世界大战'],
  [1946,1948,'战后高通胀'],[1950,1953,'朝鲜战争'],[1962,1962,'1962 年股市闪崩'],[1971,1971,'美元与黄金脱钩，金价开始自由浮动'],[1973,1974,'石油危机，大盘跌近一半'],
  [1979,1981,'通胀两位数，利率一度超过 15%'],[1987,1987,'10 月“黑色星期一”，单日跌 20% 以上'],[1990,1991,'海湾战争与经济衰退'],
  [1995,1999,'互联网大牛市'],[2000,2002,'互联网泡沫破裂，大盘跌近一半'],[2007,2009,'全球金融危机，大盘跌超过一半'],
  [2020,2020,'新冠疫情，五周内跌三成多'],[2022,2022,'加息熊市，股票债券一起跌'],[2023,2024,'AI 热潮推动大盘创新高'],[2025,2025,'关税冲击引发急跌后反弹'],
];
const UNLOCKS = [{t:12, ids:['gold']}, {t:24, stocks:[0,1]}, {t:36, ids:['tech','div','em'], stocks:[2,3,4,5]}, {t:48, ids:['lev']}];

/* ---------- knowledge cards ---------- */
const CARDS = [
  {id:'deposit', t:'每月存钱，比挑时机更重要', b:()=>'你每个月都会多出 300 美元。老王把每一笔都立刻买进标普 500，从不看盘，这叫定投。长期来看，持续投入多少本金，往往比什么时候买更能决定你最后有多少钱。'},
  {id:'inflation', t:'通胀：钱放着会变少', b:()=>`这两年物价涨了 ${pctP(S.cpi-1,1)}。一开始的 1 万美元，现在只能买到当初约 ${money(10000/S.cpi)} 的东西。现金很安全，但它的敌人是时间。`,
    quiz:{q:'如果物价每年涨 3%，24 年后物价大约是现在的几倍？', o:['1.7 倍','2 倍','3 倍'], a:1, ex:'1.03 的 24 次方约等于 2.03。每年 3% 听起来不多，24 年就能让物价翻一倍。'}},
  {id:'compound', t:'复利：收益也会生收益', b:()=>{const sp=A('spy'),g=sp.price/sp.p0;return `这 ${Math.round(S.t/12)} 年，标普 500 里的每 1 美元变成了 $${g.toFixed(2)}（年化 ${pctP(Math.pow(g,12/S.t)-1,1)}）。赚到的钱继续产生收益，时间越长，曲线越陡，所以越早开始越好。`},
    quiz:{q:'每年赚 7%，本金大约多少年能翻倍？', o:['5 年','10 年','20 年'], a:1, ex:'有个「72 法则」：72 ÷ 年收益率 ≈ 翻倍年数。72 ÷ 7 ≈ 10 年。'}},

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const pctP = (v,d=0) => (v*100).toFixed(d) + '%';

/* ---------- portfolio helpers ---------- */
const H = id => S.hold[id] || (S.hold[id] = {sh:0, cost:0, realized:0, traded:false});
const val = id => (S.hold[id] ? S.hold[id].sh * A(id).price : 0);
const total = () => S.cash + S.assets.reduce((s,a)=>s+val(a.id),0);
const eqValue = () => S.assets.filter(a=>EQUITY.has(a.group)).reduce((s,a)=>s+val(a.id),0);
const labelFor = t => { const m = MODES[S.mode]; if(m.reveal){ const [y,mo] = realYM(S.s0+t); return `${y} 年 ${mo} 月` } return `第 ${Math.floor(t/12)+1} 年 · ${t%12+1} 月` };
const ret12 = id => { const a = A(id), n = a.hist.length; return n>12 ? a.hist[n-1]/a.hist[n-13]-1 : a.hist[n-1]/a.hist[0]-1 };
const ddOf = a => 1 - a.price/Math.max(...a.hist);
const unlocked = a => a.unlockT <= S.t || val(a.id) > 0.5;
function groupWeights(){
  const T = total() || 1, w = {cash:S.cash/T};
  for(const g of GROUPS) if(g.k!=='cash') w[g.k] = 0;
  for(const a of S.assets) w[a.group] += val(a.id)/T;
  return w;
}

function doTrade(id, side, amt, opt={}){
  const a = A(id); if(!a || a.delisted || amt < 1) return null;
  const h = H(id);
  if(side==='buy'){
    let fee = Math.max(FEE_MIN, amt*FEE);
    if(amt + fee > S.cash){ amt = S.cash/(1+FEE); fee = Math.max(FEE_MIN, amt*FEE); amt = S.cash - fee }
    if(amt < 1) return null;
    h.sh += amt/a.price; h.cost += amt; S.cash -= amt + fee;
    S.fees += fee; if(!opt.auto) S.trades++; h.traded = true;
    S.log.push({t:S.t, id, side, amt, price:a.price});
    return {amt, fee};
  } else {
    const v = h.sh*a.price; amt = Math.min(amt, v); if(amt < 0.5) return null;
    const frac = amt/v, fee = Math.max(FEE_MIN, amt*FEE), costOut = h.cost*frac;
    h.realized += amt - costOut; h.cost -= costOut; h.sh *= (1-frac);
    if(frac > .9999){ h.sh = 0; h.cost = 0 }
    S.cash += amt - fee; S.fees += fee; if(!opt.forced) S.trades++; h.traded = true;
    if(!opt.forced && EQUITY.has(a.group)) S.f.lastEqSellT = S.t;
    S.log.push({t:S.t, id, side, amt, price:a.price});
    return {amt, fee};
  }
}

function userTrade(id, side, amt){
  const a = A(id), T0 = total(), eq0 = eqValue(), dd = ddOf(A('spy'));
  const res = doTrade(id, side, amt); if(!res) return null;
  const isEq = EQUITY.has(a.group), cands = [];
  if(isEq && side==='sell' && dd >= .15 && res.amt >= .2*eq0) cands.push(['panic']);
  if(isEq && side==='sell' && S.f.bearOn) S.f.soldInBear = true;
  if(isEq && side==='buy' && dd >= .25 && res.amt >= 1000) S.f.dipBuy = true;
  if(isEq && side==='buy' && dd >= .2 && res.amt >= 500) S.f.dip20 = true;
  if(isEq && side==='buy' && S.t>=12 && ret12('spy') >= .2 && res.amt >= .15*T0) cands.push(['fomo']);
  if(id==='lev' && side==='buy') cands.push(['lever']);
  if(id==='gold' && side==='buy') cands.push(['gold']);
  cands.push(...portfolioCards());
  if(S.trades >= 15) cands.push(['fees']);
  queueCards(cands, 1);
  checkMissions();
  return res;
}
function portfolioCards(){
  const T = total(), out = [];
  for(const a of S.assets) if(a.group==='stock' && val(a.id)/T >= .35) { out.push(['concentrate',{name:a.name, w:val(a.id)/T}]); break }
  const n = S.assets.filter(a=>val(a.id)/T >= .05).length + (S.cash/T >= .05 ? 1 : 0);
  if(n >= 5){ S.f.diverse = true; out.push(['diverse',{n}]) }
  return out;
}

function withdraw(amt){
  let forced = false;
  if(S.cash >= amt){ S.cash -= amt }
  else {
    let need = amt - S.cash; S.cash = 0; forced = true;
    const held = S.assets.filter(a=>val(a.id)>0.5), V = held.reduce((s,a)=>s+val(a.id),0);
    for(const a of held){ const x = Math.min(val(a.id), need*val(a.id)/V*(1+FEE) + FEE_MIN); doTrade(a.id,'sell',x,{forced:true}) }
    S.cash = Math.max(0, S.cash - need);
  }
  S.lazy = Math.max(0, S.lazy - amt); S.cashOnly = Math.max(0, S.cashOnly - amt);
  return forced;
}

/* ---------- month step ---------- */
function stepMonth(){
  const t = S.t, s = S.s0 + t, spy = A('spy');
  const T0 = total(), prevNav = S.nav;
  const heldBefore = new Set(S.assets.filter(a=>val(a.id)>1).map(a=>a.id));
  S.cash *= 1 + DATA.c[s];
  for(const a of S.assets){
    if(a.delisted){ a.hist.push(0); continue }
    a.price = Math.max(0, a.price*(1 + a.ret[t]));
    a.hist.push(a.price); a.peak = Math.max(a.peak, a.price);
    if(t===a.delistAt){ a.delisted = true; a.price = 0; if(S.hold[a.id]){ S.hold[a.id].realized -= S.hold[a.id].cost; S.hold[a.id].cost = 0; S.hold[a.id].sh = 0 } }
  }
  const T1 = total();
  if(T0 > 0) S.nav *= T1/T0;
  S.lazy *= 1 + DATA.m[s]; S.cashOnly *= 1 + DATA.c[s]; S.cpi *= 1 + DATA.i[s];
  S.t++;
  const news = [], cands = [], evs = [];
  const r = DATA.m[s], dd = ddOf(spy);
  const P = Math.abs(r)*100;
  if(r >= .08) news.push({kind:'市场', tone:'up', text:'股市大涨，标普 500 单月上涨', r, pri:P});
  else if(r >= .04) news.push({kind:'市场', tone:'up', text:'股市走强，标普 500 上涨', r, pri:P});
  else if(r <= -.08) news.push({kind:'市场', tone:'down', text:'股市暴跌，恐慌情绪蔓延，标普 500', r, pri:P});
  else if(r <= -.04) news.push({kind:'市场', tone:'down', text:'股市下跌，投资者开始担忧，标普 500', r, pri:P});
  else news.push({kind:'市场', tone:'', text:`市场波澜不惊，标普 500 小幅${r>=0?'上涨':'下跌'}`, r, pri:P});
  let panicEv = false;
  if(!S.f.bear && dd >= .2){
    S.f.bear = true; S.f.bearOn = true; S.f.bearPeak = Math.max(...spy.hist); S.f.bearPeakT = spy.hist.indexOf(S.f.bearPeak); S.f.bearStartT = S.t;
    const eqw = eqValue()/(total()||1); S.f.eqAtBear = eqw;
    news.push({kind:'市场', tone:'down', text:'大盘较高点已下跌超过 20%，正式进入熊市', pri:90}); cands.push(['bear']);
    if(eqw >= .2 && !S.f.panicAsked){ S.f.panicAsked = true; panicEv = true }
  }
  if(S.f.bearOn && spy.price >= S.f.bearPeak && S.t - S.f.bearPeakT > 3){ S.f.bearOn = false; S.f.recovered = true; news.push({kind:'市场', tone:'up', text:'大盘收复失地，重回之前的高点', pri:80}); cands.push(['recovery']) }
  let euphEv = false;
  if(S.t >= 12){
    let c12 = 1; for(let k=s-11;k<=s;k++) c12 *= 1 + DATA.i[k];
    if(c12-1 >= .07 && S.t%6===0) news.push({kind:'经济', tone:'down', text:`物价飞涨：过去 12 个月通胀达 ${pctP(c12-1,1)}`, pri:6});
    if(c12-1 <= -.03 && S.t%6===0) news.push({kind:'经济', tone:'down', text:`物价持续下跌，通缩阴影笼罩（过去 12 个月 ${pct(c12-1,1)}）`, pri:6});
    if(ret12('spy') >= .25 && !S.f.euphAsked){ S.f.euphAsked = true; euphEv = true }
  }
  const br = A('bond').ret[t], gr = A('gold').ret[t], lr = A('lev').ret[t];
  if(br <= -.03) news.push({kind:'债券', tone:'down', text:'利率急升，国债价格下跌', r:br, pri:Math.abs(br)*80});
  if(br >= .04) news.push({kind:'债券', tone:'up', text:'利率下降，国债价格上涨', r:br, pri:Math.abs(br)*80});
  if(Math.abs(gr) >= .08) news.push({kind:'黄金', tone:gr>0?'up':'down', text:gr>0?'避险需求升温，金价大涨':'金价重挫', r:gr, pri:Math.abs(gr)*70});
  if(lr <= -.3) news.push({kind:'基金', tone:'down', text:'3 倍杠杆 ETF 单月暴跌', r:lr, pri:Math.abs(lr)*40});
  for(const a of S.assets){
    const n = a.news[t]; if(!n) continue;
    if(!unlocked(a) && !heldBefore.has(a.id)) continue;
    const held = heldBefore.has(a.id);
    news.push({kind:n.kind, tone:n.tone, text:n.text, r:a.ret[t], id:a.id, pri: n.blow&&held ? 95 : Math.abs(a.ret[t])*(held?90:40)});
    if(n.earn && held) cands.push(['earnings',{name:a.name, r:a.ret[t]}]);
    if(n.blow && held) S.f.blowHeld = true;
    if(t===a.delistAt) cands.push(['delist',{name:a.name}]);
  }
  const rum = S.life.find(e=>e.type==='rumor' && e.t===t);
  if(rum){ const a = A(rum.stock); news.push({kind:'个股', tone:rum.win?'up':'down', text: rum.win ? `${a.name}证实被收购，股价飙升` : `${a.name}否认被收购传闻，股价大跌`, r:a.ret[t], id:a.id, pri:85}); cands.push(['rumor',{win:rum.win}]); const d = S.decisions.find(d=>d.rumor===rum); if(d) d.outcome = rum.win ? '传闻成真，股价飙升' : '传闻被否认，股价大跌' }
  S.cash += S.deposit; S.lazy += S.deposit; S.cashOnly += S.deposit; S.contributed += S.deposit;
  if((S.t)%12===0){ S.cash += BONUS; S.lazy += BONUS; S.cashOnly += BONUS; S.contributed += BONUS; news.push({kind:'生活', tone:'up', text:`年终奖 ${money(BONUS)} 到账`, pri:3}) }
  for(const e of S.life.filter(e=>e.t===S.t)){
    if(e.type==='raise'){ S.deposit += 50; news.push({kind:'生活', tone:'up', text:`你升职加薪了，每月可存的钱增加到 ${money(S.deposit)}`, pri:4}) }
    if(e.type==='expense'){ const forced = withdraw(e.amt); news.push({kind:'生活', tone:'down', text:`${e.what}，花了 ${money(e.amt)}`, pri:7}); evs.push(evExpense(e, forced)); if(forced) cands.push(['emergency',{amt:e.amt}]) }
    if(e.type==='rumor'){ const ev = evRumor(e); if(ev) evs.push(ev) }
  }
  if(S.auto){ const a = A(S.auto); if(a && !a.delisted){ const res = doTrade(S.auto,'buy',S.deposit,{auto:true}); if(res){ S.autoMonths++; S.f.autoStreak++ } } else { S.auto = ''; S.f.autoStreak = 0 } }
  const lh = S.hold.lev; if(lh && lh.cost > 0){ S.f.leverWorst = Math.min(S.f.leverWorst, val('lev')/lh.cost - 1) }
  if(S.t===3) cands.push(['deposit']);
  if(S.t===24) cands.push(['inflation']);
  if(S.t===(S.len>=120?60:48)) cands.push(['compound']);
  if(S.t>=18 && S.t<=40 && S.cash/total() >= .7 && S.lazy > total()*1.05) cands.push(['cashdrag']);
  if(1 - S.nav/Math.max(...S.hist.map(h=>h.nav), S.nav) >= .15) cands.push(['drawdown']);
  for(const a of S.assets) if(a.group==='stock' && !a.delisted && val(a.id) > 1 && ddOf(a) >= .5){ cands.push(['stockcrash',{name:a.name, dd:ddOf(a)}]); break }
  if(r <= -.05 && br >= 0) cands.push(['bond']);
  cands.push(...portfolioCards());
  S.hist.push({you:total(), lazy:S.lazy, cashOnly:S.cashOnly, nav:S.nav});
  S.news.push({t:S.t-1, items:news});
  S.lastMonth = {label:labelFor(S.t-1), you:S.nav/prevNav-1, spy:r, delta:T1-T0};
  S.f.maxLead = Math.max(S.f.maxLead, total()/Math.max(1,S.lazy)-1);
  if(panicEv) evs.push(evPanic());
  if(euphEv) evs.push(evEuph());
  if(!panicEv && Math.abs(r) >= .06 && eqValue()/(total()||1) >= .1 && S.t - S.f.lastBigT >= 4){ S.f.lastBigT = S.t; evs.push(evBig(r)) }
  if(S.t===3 && !S.auto) evs.push(evAuto());
  const unl = S.assets.filter(a=>a.unlockT===S.t && !a.delisted);
  if(unl.length) evs.push(evUnlock(unl));
  if(S.t >= S.len) S.ended = true;
  return {cands, evs, news, r};
}

/* ---------- missions ---------- */
function missionState(id){
  const f = S.f;
  switch(id){
    case 'bearhold': if(!f.bear) return {na:true, txt:S.ended?'本局没有熊市':'还没遇到熊市', p:0};
      { const m = S.t - Math.max(f.bearStartT, f.lastEqSellT+1); return {p:Math.min(1,m/12), txt:`${Math.max(0,Math.min(12,m))}/12 个月`} }
    case 'div4': { const T = total(); const n = S.assets.filter(a=>val(a.id)/T >= .05).length; return {p:Math.min(1,n/4), txt:`${n}/4 种`} }
    case 'rumor': return {p:f.rumorRefused>0?1:0, txt:f.rumorRefused>0?'做到了':'等消息出现'};
    case 'few': return {p:1, keep:true, fail:S.trades>8, txt:S.trades>8?'已超过':`已交易 ${S.trades}/8 次`};
    case 'quiz3': return {p:Math.min(1,S.quiz.right/3), txt:`${S.quiz.right}/3 题`};
    case 'dca24': return {p:Math.min(1,f.autoStreak/24), txt:`${f.autoStreak}/24 个月`};
    case 'lead10': return {p:Math.min(1,Math.max(0,f.maxLead)/.1), txt:`最多领先 ${pct(f.maxLead,1)}`};
    case 'dip20': if(!f.bear) return {na:true, txt:S.ended?'本局没有熊市':'还没遇到熊市', p:0};
      return {p:f.dip20?1:0, txt:f.dip20?'做到了':'等机会'};
  }
  return {p:0, txt:''};
}
function checkMissions(final){
  if(!S.missions) return;
  for(const id of S.missions){
    if(S.mdone.includes(id) || S.mfail.includes(id)) continue;
    const st = missionState(id);
    if(st.fail){ S.mfail.push(id); continue }
    if(st.keep){ if(final){ S.mdone.push(id); toast(`任务完成：${MISSIONS.find(m=>m.id===id).t}`) } continue }
    if(!st.na && st.p >= 1){ S.mdone.push(id); toast(`任务完成：${MISSIONS.find(m=>m.id===id).t}`) }
  }
}

/* ---------- modal queue (knowledge cards, trade, report, start) ---------- */
const queue = [];
let modalOpen = false;
function queueCards(cands, max=2){
  let n = 0;
  for(const [id, ctx] of cands){
    if(n>=max) break;
    if(S.seen.includes(id) || queue.some(q=>q.id===id)) continue;
    S.seen.push(id); S.ctx[id] = CARD[id].b(ctx||{});
    META.cardText = META.cardText || {}; META.cardText[id] = S.ctx[id];
    if(!META.cards.includes(id)) META.cards.push(id);
    saveMeta();
    queue.push({id, fresh:true}); n++;
  }
  pump();
}
function pump(){ if(modalOpen || !queue.length) return; stopFF(); const q = queue.shift(); showCard(q.id, q.fresh) }
function openModal(html, {wide=false, flip=false, dismiss=true}={}){
  const ov = $('#overlay'), m = $('#modal');
  m.className = 'modal' + (wide?' wide':'') + (flip?' flip':'');
  m.innerHTML = html; ov.hidden = false; modalOpen = true; m.dataset.dismiss = dismiss ? '1' : '';
  const f = m.querySelector('[autofocus]') || m.querySelector('button:not(.x)'); if(f) f.focus({preventScroll:true});
  renderBar();
}
function closeModal(){ $('#overlay').hidden = true; $('#modal').innerHTML = ''; modalOpen = false; renderAll(); setTimeout(pump, 120) }
$('#overlay').addEventListener('click', e=>{ if(e.target.id==='overlay' && $('#modal').dataset.dismiss) closeModal() });

function showCard(id, fresh){
  const c = CARD[id]; let body = (S.ctx && S.ctx[id]) || (META.cardText && META.cardText[id]);
  if(!body){ try{ body = c.b({name:'这只股票', dd:.5, amt:2000, win:false, n:5, r:0, w:.35}) }catch(e){ body = '' } if(/NaN|undefined|Infinity/.test(body)) body = '' }
  const q = c.quiz && fresh;
  let quiz = '';
  if(c.quiz) quiz = `<div class="quiz"><div class="q">小测验：${esc(c.quiz.q)}</div><div class="opts">${c.quiz.o.map((o,i)=>`<button data-qi="${i}">${esc(o)}</button>`).join('')}</div><div class="ex" id="qex" hidden></div></div>`;
  openModal(`<button class="x" aria-label="关闭">×</button><div class="eyebrow">${fresh?'新知识卡':'知识卡'} · ${String(c.n).padStart(2,'0')} / ${CARDS.length}</div><h3>${esc(c.t)}</h3><p>${esc(body)}</p>${quiz}<div class="foot"><button class="btn primary" id="card-ok" ${q?'disabled':''}>${q?'先答题':'知道了，继续'}</button></div>`, {flip:true, dismiss:!q});
  const m = $('#modal');
  m.querySelector('.x').onclick = ()=>{ if(!q || m.dataset.dismiss) closeModal() };
  $('#card-ok').onclick = closeModal;
  m.querySelectorAll('[data-qi]').forEach(b=>b.onclick = ()=>{
    const i = +b.dataset.qi, ok = i===c.quiz.a;
    m.querySelectorAll('[data-qi]').forEach(x=>{ x.disabled = true; if(+x.dataset.qi===c.quiz.a) x.classList.add('right') });
    if(!ok) b.classList.add('wrong');
    const ex = $('#qex'); ex.hidden = false; ex.innerHTML = `<strong class="${ok?'up':'down'}">${ok?'答对了！':'差一点。'}</strong> ${esc(c.quiz.ex)}`;
    if(fresh){ S.quiz.total++; if(ok) S.quiz.right++; checkMissions() }
    const btn = $('#card-ok'); btn.disabled = false; btn.textContent = '知道了，继续'; m.dataset.dismiss = '1'; btn.focus();
  });
}

    <div class="side-tabs"><button class="buy" id="sd-buy" aria-pressed="${side==='buy'}">买入</button><button class="sell" id="sd-sell" aria-pressed="${side==='sell'}" ${held?'':'disabled'}>卖出</button></div>

    if(x<=0){ pv.className='preview'; pv.textContent = cur==='buy' ? `可用现金 ${money(S.cash)}。输入金额或点上面的快捷按钮。` : `你持有 ${money(val(id))}。`; btn.disabled = true; return }
    if(cur==='buy' && x + fee > S.cash + .01){ pv.className='preview err'; pv.textContent = `现金不够：买 ${money(x)} 需要 ${money(x+fee)}（含手续费），你只有 ${money(S.cash)}。`; btn.disabled = true; return }

      : `卖出约 ${(x/a.price).toFixed(2)} 股，手续费 ${money(fee)}，到手 ${money(x-fee)}。${held&&h.cost>0?`这部分${v/h.cost-1>=0?'赚':'亏'}了约 ${money(Math.abs(x*(1-h.cost/v)))}。`:''}`;

function miniChart(a){
  const W = 640, Hh = 150, m = {l:44,r:10,t:10,b:20}, n = S.len;
  const vals = a.hist, lo0 = Math.min(...vals), hi0 = Math.max(...vals);
  const ticks = niceTicks(lo0*.95, hi0*1.05 || 1, 3), y0 = ticks[0], y1 = ticks.at(-1) || 1;
  const X = t => m.l + t/n*(W-m.l-m.r), Y = v => m.t + (1-(v-y0)/((y1-y0)||1))*(Hh-m.t-m.b);
  let g = `<g class="axis">${ticks.map(v=>`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" ${v===y0?'':'stroke-dasharray="2 4"'}/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${v>=100?v.toFixed(0):v.toFixed(v>=10?0:1)}</text>`).join('')}</g>`;
  g += `<rect x="${X(S.t)}" y="${m.t}" width="${Math.max(0,W-m.r-X(S.t))}" height="${Hh-m.t-m.b}" fill="var(--hatch)"/>`;
  g += `<polyline fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linejoin="round" points="${vals.map((v,t)=>`${X(t).toFixed(1)},${Y(v).toFixed(1)}`).join(' ')}"/>`;
  for(const l of S.log.filter(l=>l.id===a.id)){ const x = X(l.t), y = Y(a.hist[l.t]); g += l.side==='buy' ? `<path d="M${x},${y+4} l-5,9 h10z" fill="var(--up)"/>` : `<path d="M${x},${y-4} l-5,-9 h10z" fill="var(--down)"/>` }
  g += `<circle cx="${X(vals.length-1)}" cy="${Y(vals.at(-1))}" r="4" fill="var(--accent)" stroke="var(--sunk)" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(a.name)} 价格走势，绿色三角是买入，红色三角是卖出">${g}</svg>`;
}

/* ---------- quick +/- trades ---------- */
const shareAmt = () => Math.max(1, Math.round(total()*0.1));
function quickBuy(id){
  const amt = Math.min(shareAmt(), S.cash - Math.max(FEE_MIN, S.cash*FEE));
  if(amt < 1) return;
  const res = userTrade(id, 'buy', amt);
  if(res){ toast(`买入 ${A(id).name} ${money(res.amt)}，手续费 ${money(res.fee)}`); renderAll(); flashRow(id) }
}
function quickSell(id){
  const v = val(id); if(v < .5) return;
  const amt = v - shareAmt() < 1 ? v : shareAmt();
  const res = userTrade(id, 'sell', amt);
  if(res){ toast(`卖出 ${A(id).name} ${money(res.amt)}，手续费 ${money(res.fee)}`); renderAll(); flashRow(id) }
}

function annual(g){ return Math.pow(Math.max(g,1e-9), 12/S.len) - 1 }
function maxDD(arr){ let pk=-Infinity, dd=0; for(const v of arr){ pk=Math.max(pk,v); dd=Math.max(dd,1-v/pk) } return dd }
function cashIndex(){ let g = 1; for(let t=0;t<S.len;t++) g *= 1 + DATA.c[S.s0+t]; return g }
function results(){
  const you = annual(S.nav), lazy = annual(A('spy').price/100), cashA = annual(cashIndex());
  const diff = you - lazy;
  const grade = diff >= .02 ? 'S' : diff >= 0 ? 'A' : diff >= -.015 ? 'B' : diff >= -.04 ? 'C' : 'D';
  return {you, lazy, cashA, diff, grade};
}
function finishGame(){
  checkMissions(true);
  const R = results(), got = new Set();
  if(R.diff >= 0) got.add('beat');
  if(R.grade==='S') got.add('sgrade');
  if(S.f.bear && S.f.eqAtBear >= .5 && !S.f.soldInBear) got.add('diamond');
  if(S.f.dipBuy) got.add('dipbuy');
  if(S.f.diverse) got.add('diverse');
  if(S.autoMonths >= 60) got.add('dca');
  if(S.trades <= 6 && R.you > R.cashA) got.add('zen');
  if(S.quiz.right >= 4) got.add('quiz');
  if(S.f.rumorRefused > 0 && S.f.rumorTaken === 0) got.add('resist');
  if(total() >= 2*S.contributed) got.add('double');
  if(S.f.blowHeld && R.diff >= 0) got.add('survivor');
  if(S.f.leverWorst <= -.5) got.add('lever');
  S.achNew = [...got].filter(a=>!META.ach.includes(a)); S.achGot = [...got];
  META.ach = [...new Set([...META.ach, ...got])];
  META.games++;
  const order = 'SABCD', prev = META.best[S.mode];
  if(!prev || order.indexOf(R.grade) < order.indexOf(prev)) META.best[S.mode] = R.grade;
  saveMeta();
  S.result = R; S.evq = [];
  setTab('month');
  renderAll();
  if(R.diff >= 0) confetti();
}
function periodEvents(){
  const [y0,m0] = realYM(S.s0), [y1,m1] = realYM(S.s0+S.len-1);
  return EVENTS.filter(e => (e[1] > y0 || (e[1]===y0 && m0<=6)) && (e[0] < y1 || (e[0]===y1 && m1>=7)));
}

/* ---------- time controls ---------- */
function stopFF(){ if(ffTimer){ clearInterval(ffTimer); ffTimer = null; renderBar() } }
function nextMonth(){
  if(!S || S.ended || modalOpen) return true;
  if(!canAdvance()){ S.evi = S.evq.findIndex(blocking); renderMonth(); return true }
  const prevNav = S.nav;
  const res = stepMonth();
  const news = res.news.slice().sort((a,b)=>(b.pri||0)-(a.pri||0));
  const top = news[0];
  const summary = `我 ${pct(S.lastMonth.you)} · 老王 ${pct(res.r)}`;
  const newsEv = mkEv({kind:'news', tag:'上个月', title:top.text, r:top.r, tone:top.tone, sub:summary});
  const evs = res.evs;
  evs.forEach(e=>{ e.head = top; e.sub = summary });
  S.evq = S.ended ? [] : (evs.length ? evs : [newsEv]);
  S.evq.forEach(e=>{ e.more = news.slice(evs.length ? 0 : 1) });
  S.evi = 0;
  const lead = total()/Math.max(1,S.lazy)-1;
  S.lw = pick(res.r <= -.06 ? LW.crash : res.r >= .06 ? LW.boom : lead < -.05 ? LW.behind : lead > .05 ? LW.ahead : LW.calm);
  checkMissions();
  if(res.r <= -.08 && !RM){ const c = $('#content'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake') }
  if(S.nav >= Math.max(...S.hist.map(h=>h.nav)) && S.nav >= S.f.lastConfNav*1.1){ S.f.lastConfNav = S.nav; confetti() }
  queueCards(res.cands, 2);
  renderAll();
  if(S.ended) finishGame();
  return !canAdvance() || queue.length>0 || modalOpen || S.ended || evs.some(e=>e.kind==='unlock');
}
function skipToEvent(){
  if(ffTimer){ stopFF(); return }

function confetti(){
  if(RM) return;
  const cv = document.createElement('canvas'); cv.id = 'confetti'; document.body.appendChild(cv);
  const W = cv.width = innerWidth, Hh = cv.height = innerHeight, ctx = cv.getContext('2d');
  const cs = getComputedStyle(document.documentElement), cols = ['--you','--idx','--cash','--g-gold','--g-stk'].map(v=>cs.getPropertyValue(v).trim()||'#eb6834');
  const ps = Array.from({length:90}, ()=>({x:W/2 + (Math.random()-.5)*W*.3, y:Hh*.35, vx:(Math.random()-.5)*9, vy:-Math.random()*9-3, s:4+Math.random()*5, c:pick(cols), r:Math.random()*6}));
  const t0 = performance.now();
  const f = now => {

function animateNum(el, from, to){

  const ends = [];

function niceTicks(lo, hi, n){
  if(!(hi>lo)) hi = lo + 1;
  const span = hi - lo, step0 = span/n, mag = Math.pow(10, Math.floor(Math.log10(step0)));

  const a = Math.floor(lo/step)*step, b = Math.ceil(hi/step)*step, out = [];
  for(let v=a; v<=b+step/2; v+=step) out.push(+v.toFixed(6));
  return out;
}

(function(){
  const card = $('#evcard');
  let sx = null, dx = 0, id = null;
  card.addEventListener('pointerdown', e=>{
    if(card.dataset.swipe !== '1' || e.target.closest('button,summary,details')) return;
    sx = e.clientX; dx = 0; id = e.pointerId; card.setPointerCapture(id); card.style.transition = 'none';
  });
  card.addEventListener('pointermove', e=>{
    if(sx==null || e.pointerId!==id) return;
    dx = e.clientX - sx;
    card.style.transform = `translateX(${dx}px) rotate(${dx/22}deg)`;
    const L = $('#hint-l'), R = $('#hint-r');
    if(L) L.style.opacity = Math.max(0, Math.min(1, -dx/80)); if(R) R.style.opacity = Math.max(0, Math.min(1, dx/80));
  });
  const end = e=>{
    if(sx==null || e.pointerId!==id) return;
    card.style.transition = 'transform .2s ease'; sx = null;
    const ev = curEv();
    const dir = dx > 80 ? 'r' : dx < -80 ? 'l' : null;
    const ci = dir && ev ? ev.choices.findIndex(c=>c.dir===dir && !c.off) : -1;
    if(ci >= 0){ card.style.transform = `translateX(${dx>0?400:-400}px) rotate(${dx>0?18:-18}deg)`; setTimeout(()=>{ card.style.transition = ''; choose(ci) }, 180) }
    else { card.style.transform = ''; const L = $('#hint-l'), R = $('#hint-r'); if(L) L.style.opacity = 0; if(R) R.style.opacity = 0 }
  };
  card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
})();

/* ---------- tutorial ---------- */
const COACH = [
  {sel:'#t-vs', tab:'month', text:'这是你和老王的对比。老王每个月都把钱买进标普 500，从来不卖。你的目标：跑赢他。'},
  {sel:'.arow .pm.plus', tab:'invest', text:'点 + 就能买入，每次买总资产的 10%；点 − 卖出。点资产名称还能输入具体金额。'},
  {sel:'#next', tab:'month', text:'准备好就按「下个月」，时间才会前进。每个月都有新闻，遇到大事会让你做选择。'},
];
let coachI = -1;
function startCoach(){ coachI = 0; $('#coach').hidden = false; showCoach() }
function showCoach(){
  const st = COACH[coachI]; if(!st){ $('#coach').hidden = true; coachI = -1; setTab('month'); return }
  setTab(st.tab);
  requestAnimationFrame(()=>{
    const el = document.querySelector(st.sel); if(!el){ coachI++; showCoach(); return }
    const r = el.getBoundingClientRect(), p = 6, hole = $('#coach-hole'), tip = $('#coach-tip');
    Object.assign(hole.style, {left:(r.left-p)+'px', top:(r.top-p)+'px', width:(r.width+p*2)+'px', height:(r.height+p*2)+'px'});
    tip.innerHTML = `${esc(st.text)}<small>${coachI+1} / ${COACH.length} · 点任意处继续</small>`;
    const below = r.bottom + 12 + 120 < innerHeight;
    tip.style.top = below ? (r.bottom + 14)+'px' : ''; tip.style.bottom = below ? '' : (innerHeight - r.top + 14)+'px';
  });
}
$('#coach').addEventListener('click', ()=>{ coachI++; showCoach() });

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  if(!S) return;
  const t = e.target.closest('.tab'); if(t){ setTab(t.dataset.tab); return }
  const p = e.target.closest('[data-plus]'); if(p && !p.disabled){ quickBuy(p.dataset.plus); return }
  const mi = e.target.closest('[data-minus]'); if(mi && !mi.disabled){ quickSell(mi.dataset.minus); return }
  const o = e.target.closest('[data-open]'); if(o && !S.ended){ stopFF(); openTrade(o.dataset.open); return }
  const c = e.target.closest('button[data-card]'); if(c && !c.disabled){ showCard(c.dataset.card, false); return }
  const ac = e.target.closest('.al-cards'); if(ac){ albumTab = 'cards'; renderAlbum($('#album-m') || $('#album')); return }
  const aa = e.target.closest('.al-ach'); if(aa){ albumTab = 'ach'; renderAlbum($('#album-m') || $('#album')); return }
});
$('#btn-album').onclick = showAlbumModal;
$('#auto-t').addEventListener('change', e=>{ S.auto = e.target.checked ? 'spy' : ''; if(!S.auto) S.f.autoStreak = 0; toast(S.auto ? '已开启：每月工资自动买标普 500' : '已关闭自动买入'); renderAll() });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && modalOpen && $('#modal').dataset.dismiss){ closeModal(); return }
  if(modalOpen || !S || e.target.closest('input,select,textarea')) return;
  if(e.key==='ArrowRight'){ e.preventDefault(); if(S.ended) return; stopFF(); nextMonth() }
  if(['1','2','3'].includes(e.key)){ const ev = curEv(); if(ev && !ev.done) choose(+e.key-1) }
});
let rz; window.addEventListener('resize', ()=>{ clearTimeout(rz); rz = setTimeout(()=>{ if(isDesk() && tab==='album') setTab('month'); renderChart(); if(coachI>=0) showCoach() }, 120) });

function start(data){
  if(data && data.S && data.S.v===3 && data.S.assets){ S = data.S; tab = data.tab || 'month'; setTab(tab); renderAll(); return }
  if(!META.games){ newGame('blind5'); setTab('month'); renderAll(); setTimeout(startCoach, 300) }
  else { newGame('blind10'); setTab('month'); renderAll(); showStart() }
}
try{ window.claude?.hot?.snapshot?.(()=>({S, tab})) }catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
